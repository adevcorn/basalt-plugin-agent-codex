[package]
name = "basalt-plugin-codex"
version = "0.2.1"
edition = "2021"
description = "OpenAI Codex CLI launcher plugin for Basalt with model, reasoning effort, and stream JSON parsing"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
basalt-plugin-sdk = { path = "../basalt-plugin-sdk", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
